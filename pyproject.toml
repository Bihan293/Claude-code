[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "opus-agent"
version = "1.1.0"
description = "Autonomous Claude Code-like CLI coding agent for Android Termux (Anthropic Messages API / Tooken Club)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.25",
    "rich>=13",
    "prompt_toolkit>=3.0.36",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
opus = "opus_agent.cli:main"
opus-agent = "opus_agent.cli:main"

[tool.setuptools.packages.find]
include = ["opus_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
